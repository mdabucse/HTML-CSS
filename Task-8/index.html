<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>CSS Accordion Component</title>
</head>

<body>
    <header>
        <h1>CSS Accordian Component</h1>
        <p>Without Javascript</p>
    </header>
    <main>
        <div class="accordion">

            <div class="item">
                <input type="checkbox" id="item1">
                <label for="item1">Section 1</label>
                <div class="content">
                    <p>This is content 1</p>
                </div>
            </div>

            <div class="item">
                <input type="checkbox" id="item2">
                <label for="item2">Section 2</label>
                <div class="content">
                    <p>This is content 2</p>
                </div>
            </div>

        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
