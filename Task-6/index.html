<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tabbed Content Interface</title>
</head>
<body>
    <header>
        <h1>Tabbed Content Interface</h1>
        <p>Click and view the part</p>
    </header>
    <main>
        <div class="tabs">
            <!--Radio Buttons-->
            <input type="radio" name="tab" id="tab1" checked>
            <input type="radio" name="tab" id="tab2"    >
            <input type="radio" name="tab" id="tab3" >

            <!-- Labels (Tabs) -->
            <div class="tab-labels">
                <label for="tab1">Home</label>
                <label for="tab2">About</label>
                <label for="tab3">Contact</label>
            </div>

            <!-- Content -->
            <div class="tab-content">
                <div class="content content1">Home Content</div>
                <div class="content content2">About Content</div>
                <div class="content content3">Contact Content</div>
            </div>
        </div>
    </main>
    <footer>
        &copy; 2026 all rights reserved
    </footer>
</body>
</html>
